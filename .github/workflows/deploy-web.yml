name: Deploy web app to GitHub Pages

# Publishes the front end. If AWS credentials are configured it reads the API and
# login settings straight out of the deployed CloudFormation stack, so those values
# never have to be copied by hand and cannot drift out of date. With no credentials
# configured it publishes the demo-data version, which is also what a fork gets.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot be read from a step-level `if`; `env` can.
      HAS_ACCESS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test --workspace @bill/shared

      - name: Authenticate to AWS (OIDC)
        id: aws-oidc
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}

      - name: Authenticate to AWS (access keys)
        if: vars.AWS_ROLE_ARN == '' && env.HAS_ACCESS_KEYS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}

      - name: Read settings from the deployed stack
        id: stack
        continue-on-error: true
        run: |
          set -o pipefail
          outputs=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Outputs' --output json 2>/dev/null) || {
              echo "No stack found - building in demo mode."
              exit 0
            }
          get() { echo "$outputs" | jq -r --arg k "$1" '.[] | select(.OutputKey==$k) | .OutputValue'; }
          {
            echo "api=$(get ApiBaseUrl)"
            echo "pool=$(get UserPoolId)"
            echo "client=$(get UserPoolClientId)"
            echo "domain=$(get CognitoDomain)"
          } >> "$GITHUB_OUTPUT"
        env:
          STACK_NAME: ${{ vars.STACK_NAME || 'BillAnalyser' }}

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Empty when no stack was found, which is exactly what puts the app into
          # demo mode. All four are public identifiers, not credentials.
          VITE_API_BASE_URL: ${{ steps.stack.outputs.api }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.stack.outputs.pool }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.stack.outputs.client }}
          VITE_COGNITO_DOMAIN: ${{ steps.stack.outputs.domain }}

      - name: Report which mode was published
        run: |
          if [ -n "${{ steps.stack.outputs.api }}" ]; then
            echo "Published against the deployed AWS backend." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published in **demo mode** - no AWS stack was found, so the app runs on sample data held in the browser." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Add SPA fallback
        # Routing is hash-based, so this is only a safety net for a stale path-style
        # link; Pages serves 404.html for anything it cannot find.
        run: cp packages/web/dist/index.html packages/web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
