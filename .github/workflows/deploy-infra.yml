name: Deploy AWS infrastructure

# Run this from the Actions tab: pick "Deploy AWS infrastructure" on the left,
# then "Run workflow". It is safe to run repeatedly - CloudFormation applies only
# what has changed, and the receipt data, photo bucket and login pool are all
# marked to survive even a stack deletion.

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Claude model that reads the receipts (Anthropic naming, e.g. claude-opus-5)'
        required: true
        default: claude-opus-5
        type: string
      photo_retention_days:
        description: Days to keep receipt photos before deleting them
        required: true
        default: '30'

permissions:
  contents: read
  # Required for OIDC. Without it the role assumption below cannot get a token.
  id-token: write

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the region is set
        # The region is deliberately NOT an input here. It used to be, defaulting to
        # eu-west-2, while the web deploy read the AWS_REGION variable - so choosing
        # a different region in the dropdown built a second, complete stack in
        # another region and left the app pointed at the first one. Both deploys
        # succeeded and nothing said they disagreed. One source of truth instead.
        run: |
          if [ -z "${AWS_REGION}" ]; then
            echo "::error::Set the AWS_REGION repository variable (Settings - Secrets and variables - Actions - Variables). It is where your data and login live, and both deploy workflows read it, so they cannot drift apart."
            exit 1
          fi
          echo "Deploying to ${AWS_REGION}"
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Check this run is on the current main
        # Re-running a previous run replays that run's original commit, so anything
        # merged since is silently absent - the deploy succeeds and deploys old code.
        # There is no way to tell from the run page, so check it here.
        run: |
          git fetch --depth=1 origin main
          head=$(git rev-parse HEAD)
          tip=$(git rev-parse FETCH_HEAD)
          echo "Deploying $head"
          if [ "$head" != "$tip" ]; then
            echo "::error::This run is on $head, but main is now at $tip. Re-running an old run replays its original commit. Start a fresh run instead: go to the workflow in the Actions tab and use the 'Run workflow' button."
            exit 1
          fi
          echo "Up to date with main."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Two ways in. OIDC is preferred: GitHub proves who it is and AWS hands back
      # a short-lived credential, so there is no long-lived key to leak. Access keys
      # are the fallback if setting up the identity provider proves fiddly.
      - name: Authenticate to AWS (OIDC)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to AWS (access keys)
        if: vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Work out the site URL
        id: site
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "origin=https://${owner}.github.io" >> "$GITHUB_OUTPUT"

      - name: Confirm which account is being deployed to
        run: aws sts get-caller-identity

      - name: Check infrastructure tests
        run: npm run test --workspace @bill/infra

      # Idempotent: does nothing after the first time, and saves having to remember
      # that CDK needs a one-off bootstrap per account and region.
      - name: Bootstrap CDK
        working-directory: packages/infra
        run: npx cdk bootstrap --require-approval never
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SITE_ORIGIN: https://placeholder.invalid

      - name: Deploy
        working-directory: packages/infra
        run: npx cdk deploy --require-approval never --outputs-file outputs.json
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SITE_ORIGIN: ${{ steps.site.outputs.origin }}
          SITE_PATH: /${{ github.event.repository.name }}/
          ANTHROPIC_MODEL: ${{ inputs.model }}
          PHOTO_RETENTION_DAYS: ${{ inputs.photo_retention_days }}

      - name: Summarise what was created
        run: |
          {
            echo "## Infrastructure deployed"
            echo
            echo "Region: \`${{ vars.AWS_REGION }}\`"
            echo "Model: \`${{ inputs.model }}\`"
            echo
            echo "### Next"
            echo "1. Paste your Anthropic API key into the bill-analyser/anthropic-api-key secret - link below. Scanning fails until you do."
            echo "2. Create your login in the Cognito console - the link is below."
            echo "3. Run the **Deploy web app to GitHub Pages** workflow, which picks these settings up automatically."
            echo
            echo '```json'
            cat packages/infra/outputs.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
